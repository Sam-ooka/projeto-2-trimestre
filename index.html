<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OPTIC//X | A Ciência da Luz</title>


    <!-- FONTES FUTURISTAS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>


        /* =========================
           CONFIGURAÇÕES GERAIS
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            background: #050816;
            color: #edf8ff;
            font-family: "Rajdhani", sans-serif;
            overflow-x: hidden;
        }


        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background-image:

                linear-gradient(
                    rgba(0, 229, 255, 0.035) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(0, 229, 255, 0.035) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            pointer-events: none;

            z-index: -2;

        }


        body::after {

            content: "";

            position: fixed;

            width: 700px;
            height: 700px;

            top: -300px;
            right: -250px;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 217, 255, 0.12),
                    transparent 70%
                );

            pointer-events: none;

            z-index: -1;

        }


        /* =========================
           BARRA DE ROLAGEM
        ========================== */

        ::-webkit-scrollbar {
            width: 9px;
        }


        ::-webkit-scrollbar-track {
            background: #050816;
        }


        ::-webkit-scrollbar-thumb {

            background:
                linear-gradient(
                    #00e5ff,
                    #7b61ff
                );

            border-radius: 20px;

        }


        /* =========================
           CABEÇALHO
        ========================== */

        header {

            position: sticky;

            top: 0;

            z-index: 1000;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding: 18px 7%;

            background:
                rgba(5, 8, 22, 0.94);

            backdrop-filter: blur(20px);

            border-bottom:
                1px solid
                rgba(0, 229, 255, 0.18);

        }


        .logo {

            font-family: "Orbitron", sans-serif;

            font-size: 23px;

            font-weight: 900;

            letter-spacing: 3px;

            white-space: nowrap;

        }


        .logo span {
            color: #00e5ff;
        }


        nav {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 18px;

            flex-wrap: wrap;

        }


        nav a {

            text-decoration: none;

            color: #a7bac8;

            font-size: 17px;

            font-weight: 600;

            transition: 0.3s;

        }


        nav a:hover {

            color: #00e5ff;

            text-shadow:
                0 0 15px
                rgba(0, 229, 255, 0.8);

        }


        /* =========================
           HERO
        ========================== */

        .hero {

            min-height: 88vh;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 100px 8%;

            position: relative;

        }


        .hero-content {
            max-width: 1000px;
        }


        .tag {

            display: inline-block;

            padding: 9px 16px;

            margin-bottom: 25px;

            color: #00e5ff;

            border:
                1px solid
                rgba(0, 229, 255, 0.4);

            background:
                rgba(0, 229, 255, 0.05);

            font-family:
                "Orbitron",
                sans-serif;

            font-size: 12px;

            letter-spacing: 3px;

        }


        .hero h1 {

            font-family:
                "Orbitron",
                sans-serif;

            font-size:
                clamp(45px, 8vw, 96px);

            line-height: 1;

            letter-spacing: 4px;

            margin-bottom: 25px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #00e5ff,
                    #8c6dff
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color:
                transparent;

        }


        .hero p {

            max-width: 800px;

            margin: auto;

            color: #a8bac8;

            font-size: 21px;

            line-height: 1.5;

        }


        .hero-buttons {

            margin-top: 35px;

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;

        }


        .btn {

            padding: 14px 25px;

            border:
                1px solid #00e5ff;

            color: #00e5ff;

            text-decoration: none;

            background:
                rgba(0, 229, 255, 0.04);

            font-family:
                "Orbitron",
                sans-serif;

            font-size: 12px;

            letter-spacing: 1px;

            transition: 0.3s;

        }


        .btn:hover {

            background: #00e5ff;

            color: #041019;

            box-shadow:
                0 0 30px
                rgba(0, 229, 255, 0.45);

            transform:
                translateY(-3px);

        }


        /* =========================
           ESTATÍSTICAS
        ========================== */

        .stats {

            padding:
                10px 8% 80px;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(190px, 1fr)
                );

            gap: 20px;

        }


        .stat {

            padding: 25px;

            text-align: center;

            background:
                rgba(12, 20, 43, 0.75);

            border:
                1px solid
                rgba(0, 229, 255, 0.16);

            border-radius: 14px;

            transition: 0.3s;

        }


        .stat:hover {

            transform:
                translateY(-5px);

            border-color:
                rgba(0, 229, 255, 0.5);

        }


        .stat h3 {

            color: #00e5ff;

            font-family:
                "Orbitron",
                sans-serif;

            font-size: 24px;

        }


        .stat p {

            margin-top: 8px;

            color: #91a7b6;

            font-size: 17px;

        }


        /* =========================
           SEÇÕES
        ========================== */

        section {

            padding:
                100px 8%;

        }


        .section-label {

            color: #00e5ff;

            font-family:
                "Orbitron",
                sans-serif;

            font-size: 12px;

            letter-spacing: 4px;

            margin-bottom: 15px;

        }


        .section-title {

            color: white;

            font-family:
                "Orbitron",
                sans-serif;

            font-size:
                clamp(32px, 5vw, 56px);

            margin-bottom: 20px;

        }


        .section-description {

            max-width: 950px;

            color: #a7bbc7;

            font-size: 20px;

            line-height: 1.55;

            margin-bottom: 45px;

        }


        /* =========================
           CARDS
        ========================== */

        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 22px;

        }


        .card {

            padding: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18, 31, 65, 0.9),
                    rgba(6, 11, 27, 0.95)
                );

            border:
                1px solid
                rgba(0, 229, 255, 0.15);

            border-radius: 14px;

            transition: 0.35s;

            position: relative;

            overflow: hidden;

        }


        .card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #00e5ff,
                    transparent
                );

            opacity: 0;

            transition: 0.3s;

        }


        .card:hover {

            transform:
                translateY(-8px);

            border-color:
                rgba(0, 229, 255, 0.5);

            box-shadow:
                0 20px 45px
                rgba(0, 0, 0, 0.35);

        }


        .card:hover::before {
            opacity: 1;
        }


        .card-icon {

            font-size: 35px;

            margin-bottom: 15px;

        }


        .card h3 {

            color: white;

            font-family:
                "Orbitron",
                sans-serif;

            font-size: 18px;

            margin-bottom: 12px;

        }


        .card p {

            color: #a5b7c4;

            font-size: 18px;

            line-height: 1.5;

        }


        /* =========================
           QUADRO DE DESTAQUE
        ========================== */

        .highlight {

            margin-top: 35px;

            padding: 30px;

            background:
                rgba(0, 229, 255, 0.05);

            border-left:
                3px solid #00e5ff;

        }


        .highlight h3 {

            color: #00e5ff;

            font-family:
                "Orbitron",
                sans-serif;

            margin-bottom: 12px;

        }


        .highlight p {

            color: #b6c8d2;

            font-size: 18px;

            line-height: 1.6;

        }


        /* =========================
           CAIXAS DE IMAGEM
        ========================== */

        .image-box {

            margin-top: 40px;

            background:
                rgba(9, 16, 35, 0.9);

            border:
                1px solid
                rgba(0, 229, 255, 0.18);

            border-radius: 18px;

            overflow: hidden;

            transition: 0.35s;

        }


        .image-box:hover {

            border-color:
                rgba(0, 229, 255, 0.55);

            box-shadow:
                0 0 35px
                rgba(0, 229, 255, 0.1);

        }


        .image-box img {

            width: 100%;

            max-height: 500px;

            object-fit: contain;

            display: block;

            background: #ffffff;

        }


        .image-caption {

            padding: 20px 25px;

        }


        .image-caption h3 {

            font-family:
                "Orbitron",
                sans-serif;

            color: #00e5ff;

            margin-bottom: 8px;

        }


        .image-caption p {

            color: #a7bac7;

            font-size: 17px;

            line-height: 1.5;

        }


        /* =========================
           DIAGRAMA DE CORES
        ========================== */

        .color-spectrum {

            margin-top: 40px;

            padding: 35px;

            background:
                rgba(10, 18, 38, 0.9);

            border:
                1px solid
                rgba(0, 229, 255, 0.18);

            border-radius: 16px;

        }


        .spectrum-bar {

            height: 70px;

            border-radius: 10px;

            margin:
                25px 0 15px;

            background:
                linear-gradient(
                    90deg,
                    #6f00ff,
                    #3b00ff,
                    #0066ff,
                    #00d5ff,
                    #00ff95,
                    #e5ff00,
                    #ff8c00,
                    #ff0000
                );

            box-shadow:
                0 0 30px
                rgba(0, 150, 255, 0.35);

        }


        .spectrum-labels {

            display: flex;

            justify-content: space-between;

            color: #b5c5ce;

            font-size: 16px;

        }


        /* =========================
           TABELAS
        ========================== */

        .comparison {

            margin-top: 35px;

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            background:
                rgba(10, 18, 38, 0.8);

        }


        th {

            background:
                rgba(0, 229, 255, 0.12);

            color: #00e5ff;

            font-family:
                "Orbitron",
                sans-serif;

        }


        th,
        td {

            padding: 17px;

            text-align: left;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.08);

        }


        td {

            color: #b2c3cc;

            font-size: 17px;

        }


        /* =========================
           FIBRA
        ========================== */

        .fiber-box {

            padding: 35px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(0, 229, 255, 0.14),
                    rgba(7, 13, 29, 0.95)
                );

            border:
                1px solid
                rgba(0, 229, 255, 0.2);

            border-radius: 16px;

        }


        .fiber-line {

            height: 7px;

            margin: 30px 0;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #00e5ff,
                    white,
                    #00e5ff,
                    #7d5cff
                );

            box-shadow:
                0 0 25px
                #00e5ff;

            animation:
                pulse 2s infinite;

        }


        @keyframes pulse {

            0% {
                opacity: 0.55;
                transform: scaleX(0.96);
            }

            50% {
                opacity: 1;
                transform: scaleX(1);
            }

            100% {
                opacity: 0.55;
                transform: scaleX(0.96);
            }

        }


        /* =========================
           TRIONDA
        ========================== */

        .trionda {

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(123, 97, 255, 0.15),
                    transparent 45%
                );

            border-top:
                1px solid
                rgba(123, 97, 255, 0.2);

        }


        .trionda span {
            color: #ffd35d;
        }


        .tech-list {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 20px;

        }


        .tech {

            padding: 25px;

            background:
                rgba(17, 16, 40, 0.88);

            border:
                1px solid
                rgba(140, 109, 255, 0.25);

            border-radius: 14px;

            transition: 0.3s;

        }


        .tech:hover {

            transform:
                translateY(-6px);

            border-color:
                rgba(188, 166, 255, 0.7);

        }


        .tech strong {

            display: block;

            color: #bca6ff;

            font-family:
                "Orbitron",
                sans-serif;

            margin-bottom: 10px;

        }


        .tech p {

            color: #adb8c9;

            font-size: 17px;

            line-height: 1.5;

        }


        /* =========================
           FOOTER
        ========================== */

        footer {

            padding: 60px 8%;

            text-align: center;

            background: #03050d;

            border-top:
                1px solid
                rgba(0, 229, 255, 0.15);

        }


        footer h2 {

            color: #00e5ff;

            font-family:
                "Orbitron",
                sans-serif;

            margin-bottom: 15px;

        }


        footer p {

            color: #80939f;

            font-size: 17px;

        }


        /* =========================
           BOTÃO TOPO
        ========================== */

        #topBtn {

            position: fixed;

            right: 20px;

            bottom: 20px;

            width: 50px;

            height: 50px;

            display: none;

            border-radius: 50%;

            border:
                1px solid #00e5ff;

            background: #07101f;

            color: #00e5ff;

            font-size: 22px;

            cursor: pointer;

            z-index: 1000;

            transition: 0.3s;

        }


        #topBtn:hover {

            background: #00e5ff;

            color: #041019;

            box-shadow:
                0 0 25px
                rgba(0, 229, 255, 0.5);

        }


        /* =========================
           RESPONSIVIDADE
        ========================== */

        @media (max-width: 850px) {

            header {

                flex-direction: column;

                padding: 18px 5%;

            }


            nav {
                gap: 12px;
            }


            nav a {
                font-size: 15px;
            }


            section {
                padding: 75px 7%;
            }


            .hero {
                min-height: 80vh;
            }


            .hero p,
            .section-description {
                font-size: 18px;
            }


            .spectrum-labels {
                font-size: 12px;
            }

        }


    </style>

</head>


<body>


    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header>

        <div class="logo">
            OPTIC<span>//</span>X
        </div>


        <nav>

            <a href="#luz">Luz</a>

            <a href="#fibra">Fibra</a>

            <a href="#cores">Cores</a>

            <a href="#espelhos">Espelhos</a>

            <a href="#olho">Olho</a>

            <a href="#trionda">Trionda</a>

        </nav>

    </header>



    <main>


        <!-- =========================
             HERO
        ========================== -->

        <section class="hero">

            <div class="hero-content">

                <div class="tag">
                    FÍSICA • ÓPTICA • TECNOLOGIA
                </div>


                <h1>
                    A CIÊNCIA DA LUZ
                </h1>


                <p>

                    Uma viagem pela óptica, pelas cores,
                    p
